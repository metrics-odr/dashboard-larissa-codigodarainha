name: Gerar Métricas dos Relatórios

# Calcula (só matemática, sem IA) as métricas por período usadas pelo
# Briefing do Gestor e commita build/relatorios_metrics.json na main.
# Roda ~9 min antes da Routine do Claude Code (23:59 BRT) que lê esse
# arquivo e redige os textos — o runner do GitHub Actions alcança o
# Google Sheets (docs.google.com), o que o sandbox do agente não alcança.
on:
  workflow_dispatch:
  schedule:
    - cron: "50 2 * * *"  # 23:50 BRT (backup nativo; pode atrasar minutos)

permissions:
  contents: write

concurrency:
  group: relatorios-metrics
  cancel-in-progress: false

jobs:
  gerar-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar métricas (lê as planilhas via CSV público, somente leitura)
        run: python build/gerar_relatorios.py --out build/relatorios_metrics.json

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- build/relatorios_metrics.json; then
            echo "sem mudanças nas métricas"
            exit 0
          fi
          git add build/relatorios_metrics.json
          git commit -m "Atualiza métricas dos relatórios (automático)"
          git push
